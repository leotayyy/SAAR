<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>SAAR · Configurador 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Chakra+Petch:wght@400;500;600;700&family=Anton&family=Bebas+Neue&family=Oswald:wght@700&family=Teko:wght@600&family=Black+Ops+One&family=Bangers&family=Permanent+Marker&family=Rock+Salt&family=Pacifico&family=Lobster&family=Playfair+Display:wght@900&family=Cinzel:wght@900&family=Orbitron:wght@900&family=Press+Start+2P&family=Special+Elite&family=Russo+One&family=Staatliches&family=Creepster&family=Metal+Mania&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090b;--bg2:#0f1114;--panel:#121418;--card:#181b20;--line:#262a31;--text:#f3f1ec;--muted:#8d9098;--accent:#ff4a1c;--accent2:#ff8a3d;--ok:#d7ff3a;--r:14px;--sheet:46dvh;
--fh:"Big Shoulders Display",Impact,sans-serif;--fu:"Chakra Petch",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--fu);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
button{font-family:inherit;color:inherit}
#root{height:100%}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.app.open{--sheet:74dvh}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:relative;z-index:3;animation:fade .5s ease both}
.logo{height:38px;display:block;mix-blend-mode:screen}
.tag{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,74,28,.18);animation:pulse 2s infinite}
.model-badge{margin-left:auto;font-family:var(--fh);font-weight:800;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}

/* stage */
.stage{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab;overflow:hidden;
background:radial-gradient(55% 50% at 50% 46%,rgba(255,74,28,.20),transparent 70%),
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
.hint{position:absolute;top:12px;left:16px;right:70px;font-size:11px;letter-spacing:.4px;color:var(--muted);pointer-events:none;z-index:1}
.zoom{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(18,20,24,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:22px;line-height:1;cursor:pointer;transition:background-color .15s,transform .15s,border-color .15s}
.zoom button:hover{border-color:var(--accent)}
.zoom button:active{transform:scale(.92)}
.zoom .rs{font-size:18px}
.views{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(18,20,24,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:2;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views button{flex:none;min-height:38px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer;transition:background-color .2s,color .2s}
.views button:hover{background:rgba(255,255,255,.06)}
.views button.on{background:var(--text);color:var(--bg)}
.views .auto{display:flex;align-items:center;gap:7px;border-left:1px solid var(--line);border-radius:0 999px 999px 0}
.views .auto i{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background-color .2s}
.views .auto.on{background:var(--accent);color:#fff}
.views .auto.on i{background:#fff;animation:pulse 1.2s infinite}

/* sheet */
.sheet{height:var(--sheet);flex:none;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:3;box-shadow:0 -20px 40px rgba(0,0,0,.45);transition:height .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.handle{flex:none;display:flex;justify-content:center;align-items:center;height:22px;border:0;background:none;cursor:pointer;width:100%}
.handle span{width:44px;height:5px;border-radius:9px;background:#3a3f48;transition:background-color .2s,width .2s}
.handle:hover span{background:var(--accent);width:56px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 12px 10px;border-bottom:1px solid var(--line)}
.tabs button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:none;cursor:pointer;font-family:var(--fh);font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s}
.tabs button small{font-family:var(--fu);font-size:10px;font-weight:600;letter-spacing:1px;opacity:.7}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);background:var(--card);border-color:var(--line)}
.tabs button.on small{color:var(--accent);opacity:1}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.row{margin-bottom:22px;animation:fade .35s ease both}
.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}
.lbl{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
.lbl:after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.45}

/* color */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px}
.sw .c{aspect-ratio:1;width:100%;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.sw .c:hover{transform:scale(1.07)}
.sw .c.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent);transform:scale(1.04)}
.sw .custom{background:conic-gradient(#f43,#fd3,#4e6,#3cf,#64f,#f4c,#f43)}
.sw .custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cur{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:1px}
.cur span{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}

/* models */
.models{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.model{text-align:left;padding:16px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:border-color .2s,transform .15s,background-color .2s}
.model:active{transform:scale(.98)}
.model b{font-family:var(--fh);font-weight:800;font-size:22px;letter-spacing:1px;text-transform:uppercase;line-height:1}
.model small{font-size:12px;color:var(--muted)}
.model:after{content:"";position:absolute;right:12px;top:12px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);transition:background-color .2s,border-color .2s}
.model.on{border-color:var(--accent);background:linear-gradient(160deg,rgba(255,74,28,.16),var(--card) 70%)}
.model.on:after{background:var(--accent);border-color:var(--accent)}

/* text */
.preview{margin:0 0 12px;padding:18px 10px;border-radius:var(--r);border:1px dashed #3a3f48;background:var(--bg2);text-align:center;font-size:34px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fonts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fonts button{min-height:48px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:border-color .15s,background-color .15s}
.fonts button:hover{border-color:#3d434d}
.fonts button.on{border-color:var(--accent);background:rgba(255,74,28,.14)}
.txt{display:flex;gap:8px}
.txt input[type=text]{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:600 16px var(--fu);outline:none;transition:border-color .15s}
.txt input[type=text]:focus{border-color:var(--accent)}
.txt input[type=color]{width:48px;height:48px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:4px;cursor:pointer}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-family:var(--fh);font-weight:800;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:transform .15s,background-color .2s,box-shadow .2s;box-shadow:0 10px 24px -10px rgba(255,74,28,.7)}
.btn:hover{background:#ff5f36}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger:hover{border-color:#ff3b3b;color:#ff6b6b}
.ic{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.ic button{aspect-ratio:1;font-size:24px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .15s,border-color .15s}
.ic button:hover{border-color:var(--accent);transform:translateY(-2px)}
.ic button:active{transform:scale(.92)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s,border-color .15s}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.ctl{margin-top:12px;padding:14px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--line)}
label.s{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:12px}
label.s span{width:62px;color:var(--muted);font-weight:600}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:#2c3038;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--text);border:5px solid var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--text);border:5px solid var(--accent);cursor:pointer}

@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.4}}

@media (max-width:420px){.tag{display:none}.tabs button{font-size:14px;padding:8px 6px}.hint{font-size:10px}}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:1fr 420px;grid-template-rows:auto 1fr}
  .top{grid-column:1/-1;padding:12px 24px}
  .logo{height:44px}
  .stage{grid-row:2}
  .sheet{grid-row:2;height:auto;margin:0;border-radius:0;border-top:0;border-left:1px solid var(--line);box-shadow:none;padding-top:14px}
  .handle{display:none}
  .hint{top:auto;bottom:74px;left:0;right:0;text-align:center}
  .views{bottom:22px}
  .body{padding:20px 22px 32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  g.setIndex(idx);g.addGroup(0,idxA.length,0);g.addGroup(idxA.length,idxB.length,1);g.computeVertexNormals();
  const nm=g.getAttribute('normal'),keep=[];
  for(let q=0;q<idxP.length;q+=3){if((nm.getZ(idxP[q])+nm.getZ(idxP[q+1])+nm.getZ(idxP[q+2]))/3>0.35)keep.push(idxP[q],idxP[q+1],idxP[q+2]);}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  keep.forEach(v=>{const X=pos[v*3],Y=pos[v*3+1];if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y;});
  const uv=[];for(let v=0;v<pos.length/3;v++)uv.push((pos[v*3]-x0)/(x1-x0||1),(pos[v*3+1]-y0)/(y1-y0||1));
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',g.getAttribute('position'));pg.setAttribute('normal',nm);
  pg.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));pg.setIndex(keep);
  g.userData.pg=pg;return g;
}

function makeTexture(kind,value,color,fnt){
  const cv=document.createElement('canvas');let ctx,aspect=1;
  if(kind==='image'){
    const sc=Math.min(1,512/Math.max(value.width,value.height));
    cv.width=Math.max(1,Math.round(value.width*sc));cv.height=Math.max(1,Math.round(value.height*sc));
    ctx=cv.getContext('2d');ctx.drawImage(value,0,0,cv.width,cv.height);aspect=cv.height/cv.width;
  }else if(kind==='icon'){cv.width=cv.height=256;ctx=cv.getContext('2d');ctx.font='190px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(value,128,140);}
  else{
    cv.width=512;cv.height=192;aspect=192/512;ctx=cv.getContext('2d');
    let fs=130;const fa=fnt||['Impact',900];const f=()=>fa[1]+' '+fs+'px "'+fa[0]+'", Impact, sans-serif';
    ctx.font=f();while(ctx.measureText(value).width>470&&fs>20){fs-=4;ctx.font=f();}
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,fs/9);
    ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(value,256,100);ctx.fillStyle=color;ctx.fillText(value,256,100);
  }
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return {t,aspect};
}

function App(){
  const host=useRef(null),api=useRef(null);
  const [color,setColor]=useState('#f8fafc');
  const [type,setType]=useState('upper');
  const [text,setText]=useState('');
  const [tcolor,setTcolor]=useState('#ffffff');
  const [decals,setDecals]=useState([]);
  const [sel,setSel]=useState(null);
  const [tab,setTab]=useState('Color');
  const [auto,setAuto]=useState(false);
  const [print,setPrint]=useState({on:false,s:1,ox:0,oy:0});
  const [font,setFont]=useState(FONTS[0]);

  useEffect(()=>{
    const el=host.current;
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    el.appendChild(renderer.domElement);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(40,1,0.1,50);
    camera.position.set(0,3.4,7.6);
    const controls=new THREE.OrbitControls(camera,renderer.domElement);
    controls.enableDamping=true;controls.enablePan=false;controls.minDistance=2.5;controls.maxDistance=11;
    scene.add(new THREE.HemisphereLight(0xffffff,0x556070,0.85));
    const d1=new THREE.DirectionalLight(0xffffff,0.9);d1.position.set(3,5,4);scene.add(d1);
    const d2=new THREE.DirectionalLight(0xbcd0ff,0.5);d2.position.set(-4,2,-3);scene.add(d2);
    const d3=new THREE.DirectionalLight(0xff6a4d,0.7);d3.position.set(0,2,-5);scene.add(d3);
    const sc=document.createElement('canvas');sc.width=sc.height=128;const sx=sc.getContext('2d');
    const gr=sx.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=gr;sx.fillRect(0,0,128,128);
    const shadow=new THREE.Mesh(new THREE.PlaneGeometry(5.5,5.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,depthWrite:false}));
    shadow.rotation.x=-Math.PI/2;shadow.position.y=-0.4;scene.add(shadow);
    const mat=new THREE.MeshPhysicalMaterial({color:'#f8fafc',roughness:0.18,clearcoat:1,clearcoatRoughness:0.08,side:THREE.DoubleSide});
    const mat2=new THREE.MeshPhysicalMaterial({color:'#f8fafc',roughness:0.18,clearcoat:1,clearcoatRoughness:0.08,side:THREE.DoubleSide});
    let guard=new THREE.Mesh(buildGuard(false),[mat,mat2]);scene.add(guard);
    const pmat=new THREE.MeshStandardMaterial({roughness:0.4,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
    const pm=new THREE.Mesh(guard.geometry.userData.pg,pmat);pm.visible=false;pm.renderOrder=1;scene.add(pm);
    const items=[];let drag=null,nid=1;
    const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
    const setRay=e=>{const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);};
    const apply=d=>{
      d.mesh.position.copy(d.p).addScaledVector(d.n,0.015);
      d.mesh.lookAt(d.p.clone().add(d.n));d.mesh.rotateZ(d.spin);
    };
    const place=(d,p,n)=>{d.p=p.clone();d.n=n.clone().normalize();apply(d);};

    const onDown=e=>{
      setRay(e);const hit=ray.intersectObjects(items.map(i=>i.mesh))[0];
      if(hit){drag=items.find(i=>i.mesh===hit.object);controls.enabled=false;renderer.domElement.setPointerCapture(e.pointerId);setSel(drag.id);}
    };
    const onMove=e=>{
      if(!drag)return;setRay(e);const hit=ray.intersectObject(guard)[0];
      if(hit)place(drag,hit.point,hit.face.normal);
    };
    const onUp=()=>{drag=null;controls.enabled=true;};
    const cv=renderer.domElement;
    cv.addEventListener('pointerdown',onDown);cv.addEventListener('pointermove',onMove);
    cv.addEventListener('pointerup',onUp);cv.addEventListener('pointercancel',onUp);

    const resize=()=>{
      const w=el.clientWidth,hh=el.clientHeight;if(!w||!hh)return;
      renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();
    };
    const ro=new ResizeObserver(resize);ro.observe(el);resize();

    let raf;const loop=()=>{raf=requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);};loop();

    api.current={
      setColor:c=>{mat.color.set(c);mat2.color.set(c);},
      setType:t=>{
        guard.geometry.dispose();guard.geometry=buildGuard(t==='lower');pm.geometry=guard.geometry.userData.pg;
        items.forEach(d=>{
          ray.set(d.p.clone().addScaledVector(d.n,2),d.n.clone().negate());
          const hit=ray.intersectObject(guard)[0];if(hit)place(d,hit.point,hit.face.normal);
        });
      },
      add:(kind,value,col,fnt)=>{
        const {t,aspect}=makeTexture(kind,value,col,fnt);
        const m=new THREE.Mesh(new THREE.PlaneGeometry(1,aspect),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,side:THREE.DoubleSide}));
        m.renderOrder=2;scene.add(m);
        const d={id:nid++,mesh:m,spin:0,size:0.5,label:kind==='icon'?value:kind==='image'?'Imagen '+(nid-1):value.slice(0,10)};
        m.scale.set(d.size,d.size,1);
        let hit=null;
        ray.setFromCamera(new THREE.Vector2(0,0),camera);hit=ray.intersectObject(guard)[0];
        if(!hit){ray.set(camera.position,new THREE.Vector3(0,0.15,1.3).sub(camera.position).normalize());hit=ray.intersectObject(guard)[0];}
        if(hit)place(d,hit.point,hit.face.normal);else place(d,new THREE.Vector3(0,0.3,1),new THREE.Vector3(0,1,0));
        items.push(d);return {id:d.id,label:d.label,size:d.size,spin:0};
      },
      update:(id,v)=>{
        const d=items.find(i=>i.id===id);if(!d)return;
        if(v.size!==undefined){d.size=v.size;d.mesh.scale.set(v.size,v.size,1);}
        if(v.spin!==undefined){d.spin=v.spin;apply(d);}
      },
      remove:id=>{
        const k=items.findIndex(i=>i.id===id);if(k<0)return;
        scene.remove(items[k].mesh);items[k].mesh.material.map.dispose();items.splice(k,1);
      },
      reset:()=>{camera.position.set(0,3.4,7.6);controls.target.set(0,0,0);controls.autoRotate=false;},
      view:a=>{controls.autoRotate=false;camera.position.set(Math.sin(a)*7,3.2,Math.cos(a)*7);controls.target.set(0,0,0);},
      auto:b=>{controls.autoRotate=b;controls.autoRotateSpeed=2.5;},
      zoom:f=>{camera.position.multiplyScalar(f);},
      print:img=>{
        const sc=Math.min(1,1024/Math.max(img.width,img.height)),w=Math.round(img.width*sc),hh=Math.round(img.height*sc);
        const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.drawImage(img,0,0,w,hh);
        const id=x.getImageData(0,0,w,hh),d=id.data,seen=new Uint8Array(w*hh),st=[];
        const bg=p=>d[p*4+3]<20||(d[p*4]>235&&d[p*4+1]>235&&d[p*4+2]>235);
        const push=p=>{if(!seen[p]&&bg(p)){seen[p]=1;st.push(p);}};
        for(let i=0;i<w;i++){push(i);push((hh-1)*w+i);}
        for(let j=0;j<hh;j++){push(j*w);push(j*w+w-1);}
        while(st.length){const p=st.pop(),px=p%w,py=(p-px)/w;d[p*4+3]=0;if(px>0)push(p-1);if(px<w-1)push(p+1);if(py>0)push(p-w);if(py<hh-1)push(p+w);}
        let x0=w,y0=hh,x1=0,y1=0;
        for(let p=0;p<w*hh;p++)if(d[p*4+3]>20){const px=p%w,py=(p-px)/w;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;}
        if(x1<=x0||y1<=y0){x0=0;y0=0;x1=w-1;y1=hh-1;}
        x.putImageData(id,0,0);
        const cw=x1-x0+1,ch=y1-y0+1,o=document.createElement('canvas');o.width=cw+8;o.height=ch+8;
        o.getContext('2d').drawImage(c,x0,y0,cw,ch,4,4,cw,ch);
        if(pmat.map)pmat.map.dispose();
        const t=new THREE.CanvasTexture(o);t.anisotropy=4;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
        pmat.map=t;pmat.needsUpdate=true;pm.visible=true;api.current.printXf({s:1,ox:0,oy:0});
      },
      printXf:p=>{const t=pmat.map;if(!t)return;t.repeat.set(1/p.s,1/p.s);t.offset.set(0.5-0.5/p.s-p.ox,0.5-0.5/p.s-p.oy);},
      printOff:()=>{pm.visible=false;if(pmat.map){pmat.map.dispose();pmat.map=null;pmat.needsUpdate=true;}}
    };
    return()=>{cancelAnimationFrame(raf);ro.disconnect();controls.dispose();renderer.dispose();el.removeChild(cv);};
  },[]);

  const cur=decals.find(d=>d.id===sel);
  const pickColor=c=>{setColor(c);api.current.setColor(c);};
  const pickType=t=>{setType(t);api.current.setType(t);};
  const addItem=(kind,val)=>{
    const go=()=>{const d=api.current.add(kind,val,tcolor,font);setDecals(a=>[...a,d]);setSel(d.id);};
    if(kind==='text'&&document.fonts&&document.fonts.load)document.fonts.load(font[1]+' 100px "'+font[0]+'"',val).then(go,go);else go();
  };
  const addImage=f=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{const d=api.current.add('image',img,tcolor);setDecals(a=>[...a,d]);setSel(d.id);};
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  };
  const addPrint=f=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{api.current.print(img);setPrint({on:true,s:1,ox:0,oy:0});};img.src=fr.result;};
    fr.readAsDataURL(f);
  };
  const updPrint=v=>{const p={...print,...v};setPrint(p);api.current.printXf(p);};
  const removePrint=()=>{api.current.printOff();setPrint({on:false,s:1,ox:0,oy:0});};
  const upd=(v)=>{api.current.update(sel,v);setDecals(a=>a.map(d=>d.id===sel?{...d,...v}:d));};
  const del=()=>{api.current.remove(sel);setDecals(a=>a.filter(d=>d.id!==sel));setSel(null);};

  const [open,setOpen]=useState(false);
  const TABS=['Color','Estilo','Texto','Gráficos'];
  const VIEWS=[['Frontal',0],['Izq.',-1.5708],['Trasera',3.1416],['Der.',1.5708]];
  const [view,setView]=useState('Frontal');
  const MODELS=[['upper','MMA / Boxeo','Arco superior completo'],['lower','Powerlifting','Perfil bajo, mordida firme']];
  const sec=(lbl,...kids)=>h('section',{className:'row'},h('div',{className:'lbl'},lbl),...kids);
  const file=(txt,fn,tid)=>h('label',{className:'btn ghost','data-testid':tid},txt,
    h('input',{type:'file',accept:'image/*',hidden:true,onChange:e=>{const f=e.target.files[0];if(f)fn(f);e.target.value='';}}));
  const range=(lbl,min,max,step,val,on,tid)=>h('label',{className:'s'},h('span',null,lbl),
    h('input',{type:'range',min,max,step,value:val,onChange:e=>on(+e.target.value),'data-testid':tid}));

  return h('div',{className:'app'+(open?' open':'')},
    h('header',{className:'top'},
      h('img',{src:LOGO,alt:'SAAR Mouthguards',className:'logo'}),
      h('div',{className:'tag'},h('span',{className:'dot'}),'Configurador 3D'),
      h('div',{className:'model-badge','data-testid':'current-model-label'},type==='upper'?'MMA / Boxeo':'Powerlifting')),
    h('main',{className:'stage',ref:host,'data-testid':'viewer-stage'},
      h('div',{className:'hint'},'Arrastra para girar · pellizca para acercar · arrastra un diseño para moverlo'),
      h('div',{className:'zoom'},
        h('button',{onClick:()=>api.current.zoom(0.85),'aria-label':'Acercar','data-testid':'zoom-in-btn'},'+'),
        h('button',{onClick:()=>api.current.zoom(1.18),'aria-label':'Alejar','data-testid':'zoom-out-btn'},'−'),
        h('button',{onClick:()=>{api.current.reset();setAuto(false);setView('Frontal');},'aria-label':'Reset','data-testid':'reset-view-btn',className:'rs'},'↺')),
      h('div',{className:'views'},
        VIEWS.map(v=>h('button',{key:v[0],className:view===v[0]?'on':'','data-testid':'view-'+v[0].replace('.','').toLowerCase()+'-btn',onClick:()=>{setView(v[0]);setAuto(false);api.current.view(v[1]);}},v[0])),
        h('button',{className:'auto'+(auto?' on':''),'data-testid':'auto-rotate-btn',onClick:()=>{const b=!auto;setAuto(b);if(b)setView('');api.current.auto(b);}},h('i',null),'Auto'))),
    h('aside',{className:'sheet','data-testid':'control-panel'},
      h('button',{className:'handle','aria-label':'Expandir panel','data-testid':'panel-handle',onClick:()=>setOpen(!open)},h('span')),
      h('nav',{className:'tabs'},TABS.map((t,i)=>h('button',{key:t,className:tab===t?'on':'','data-testid':'tab-'+t.toLowerCase().replace('á','a'),onClick:()=>setTab(t)},h('small',null,'0'+(i+1)),t))),
      h('div',{className:'body',key:tab},
        tab==='Color'&&sec('Color del bucal',
          h('div',{className:'sw'},COLORS.map(c=>h('button',{key:c,className:'c'+(color===c?' on':''),style:{background:c},'aria-label':c,'data-testid':'color-swatch-'+c.slice(1),onClick:()=>pickColor(c)})),
            h('label',{className:'c custom',title:'Color personalizado'},h('input',{type:'color',value:color,onChange:e=>pickColor(e.target.value),'data-testid':'custom-color-input'}))),
          h('div',{className:'cur'},h('span',{style:{background:color}}),color.toUpperCase())),
        tab==='Estilo'&&sec('Modelo',
          h('div',{className:'models'},MODELS.map(m=>h('button',{key:m[0],className:'model'+(type===m[0]?' on':''),'data-testid':'model-'+m[0]+'-btn',onClick:()=>pickType(m[0])},
            h('b',null,m[1]),h('small',null,m[2]))))),
        tab==='Texto'&&sec('Tipografía',
          h('div',{className:'preview','data-testid':'text-preview',style:{fontFamily:'"'+font[0]+'",sans-serif',fontWeight:font[1],color:tcolor}},text||'TU APODO'),
          h('div',{className:'fonts'},FONTS.map(f=>h('button',{key:f[0],className:font[0]===f[0]?'on':'','data-testid':'font-'+f[0].replace(/\s/g,'-').toLowerCase(),style:{fontFamily:'"'+f[0]+'",sans-serif',fontWeight:f[1]},onClick:()=>setFont(f)},f[0])))),
        tab==='Texto'&&sec('Agregar texto',
          h('div',{className:'txt'},
            h('input',{type:'text',maxLength:14,placeholder:'Tu apodo',value:text,onChange:e=>setText(e.target.value),'data-testid':'text-input'}),
            h('input',{type:'color',value:tcolor,onChange:e=>setTcolor(e.target.value),'data-testid':'text-color-input'}),
            h('button',{className:'btn','data-testid':'add-text-btn',onClick:()=>{if(text.trim()){addItem('text',text.trim());setText('');}}},'Añadir'))),
        tab==='Gráficos'&&sec('Agregar ícono',
          h('div',{className:'ic'},ICONS.map((i,k)=>h('button',{key:i,'data-testid':'icon-btn-'+k,onClick:()=>addItem('icon',i)},i)))),
        tab==='Gráficos'&&sec('Impresión frontal',
          file(print.on?'Cambiar diseño':'Subir diseño',addPrint,'upload-print-btn'),
          h('p',{className:'note'},'Se proyecta en el frente como una impresión real. Funciona con fondo blanco o transparente.'),
          print.on&&h('div',{className:'ctl'},
            range('Tamaño',0.5,1.6,0.01,print.s,v=>updPrint({s:v}),'print-size-range'),
            range('Pos. X',-0.5,0.5,0.01,print.ox,v=>updPrint({ox:v}),'print-x-range'),
            range('Pos. Y',-0.5,0.5,0.01,print.oy,v=>updPrint({oy:v}),'print-y-range'),
            h('button',{className:'btn ghost danger',onClick:removePrint,'data-testid':'remove-print-btn'},'Quitar'))),
        tab==='Gráficos'&&sec('Subir imagen o logo',
          file('Elegir imagen',addImage,'upload-image-btn'),
          h('p',{className:'note'},'Los PNG con fondo transparente se ven mejor.')),
        (tab==='Texto'||tab==='Gráficos')&&decals.length>0&&sec('Tus diseños',
          h('div',{className:'chips'},decals.map(d=>h('button',{key:d.id,className:'chip'+(sel===d.id?' on':''),'data-testid':'decal-chip-'+d.id,onClick:()=>setSel(d.id)},d.label))),
          cur&&h('div',{className:'ctl'},
            range('Tamaño',0.2,1.4,0.01,cur.size,v=>upd({size:v}),'decal-size-range'),
            range('Rotar',-3.14,3.14,0.02,cur.spin,v=>upd({spin:v}),'decal-rotate-range'),
            h('button',{className:'btn ghost danger',onClick:del,'data-testid':'delete-decal-btn'},'Eliminar'))))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
